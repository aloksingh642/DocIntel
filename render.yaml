# Render Blueprint — one-click deploy of the Intelligent Document Processing System.
#
#   Dashboard → New → Blueprint → pick this repo → Apply.
#
# Creates a free web service (API + built React frontend served same-origin)
# plus a free PostgreSQL database. On startup the app auto-creates its schema
# and seeds an admin user from ADMIN_EMAIL / ADMIN_PASSWORD below.

services:
  - type: web
    name: idp-system
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: idp-db
          property: connectionString
      # Long random string generated by Render — never commit a real secret.
      - key: SECRET_KEY
        generateValue: true
      # Works fully offline with the deterministic mock provider.
      # To use real AI later: set AI_PROVIDER=openai and AI_API_KEY in the dashboard.
      - key: AI_PROVIDER
        value: mock
      - key: ADMIN_EMAIL
        value: admin@idp.dev
      # You will be prompted for this when applying the blueprint (not stored in git).
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads

databases:
  - name: idp-db
    plan: free
    databaseName: idp
    user: idp
